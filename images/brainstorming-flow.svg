<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1100" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="960" height="1100" rx="16" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">superpowers brainstorming 흐름 (v7.0.0)</text>

  <!-- 요청 -->
  <rect x="380" y="62" width="200" height="44" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="480" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#0969da">요청 도착</text>
  <line x1="480" y1="106" x2="480" y2="124" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 자기 점검 -->
  <polygon points="320,168 480,126 640,168 480,210" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="480" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">내가 아는 게 충분한가?</text>
  <text x="480" y="184" text-anchor="middle" font-size="12" fill="#57606a">(속으로 점검)</text>

  <!-- 바로 실행 -->
  <line x1="320" y1="168" x2="252" y2="168" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <text x="286" y="158" text-anchor="middle" font-size="11" fill="#57606a">다 있음</text>
  <rect x="40" y="140" width="210" height="58" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="145" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">바로 실행</text>
  <text x="145" y="186" text-anchor="middle" font-size="12" fill="#57606a">예: 아이콘을 파란색으로</text>

  <line x1="480" y1="210" x2="480" y2="236" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <text x="492" y="228" font-size="11" fill="#57606a">중요한 게 빠짐</text>

  <!-- 첫 메시지 -->
  <rect x="320" y="238" width="320" height="78" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="480" y="263" text-anchor="middle" font-size="15" font-weight="700" fill="#0969da">첫 메시지 (딱 두 가지)</text>
  <text x="480" y="284" text-anchor="middle" font-size="12.5" fill="#1f2328">① 질문 없이 바로 시작해도 된다는 안내</text>
  <text x="480" y="304" text-anchor="middle" font-size="12.5" fill="#1f2328">② 실제 장면을 묻는 열린 질문 1개</text>

  <!-- 옵트아웃 -->
  <line x1="640" y1="277" x2="708" y2="277" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <text x="674" y="267" text-anchor="middle" font-size="11" fill="#57606a">건너뛸게요</text>
  <rect x="710" y="248" width="210" height="58" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="815" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">만드는 방식만 한 줄로</text>
  <text x="815" y="292" text-anchor="middle" font-size="12" fill="#57606a">밝히고 실행 (스킬 종료)</text>

  <line x1="480" y1="316" x2="480" y2="346" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 대화 루프 -->
  <rect x="200" y="348" width="560" height="190" rx="14" fill="#fbefff" stroke="#8250df" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="374" text-anchor="middle" font-size="15" font-weight="700" fill="#8250df">대화 루프 — 메시지마다 질문 1개</text>
  <rect x="235" y="390" width="210" height="62" rx="10" fill="#ffffff" stroke="#8250df"/>
  <text x="340" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">질문</text>
  <text x="340" y="437" text-anchor="middle" font-size="11.5" fill="#57606a">열린 질문 먼저 · 메뉴는 막힐 때만</text>
  <rect x="515" y="390" width="210" height="62" rx="10" fill="#ffffff" stroke="#8250df"/>
  <text x="620" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">플레이백</text>
  <text x="620" y="437" text-anchor="middle" font-size="11.5" fill="#57606a">200~300단어 되읽기 · 추측 표시</text>
  <line x1="445" y1="408" x2="512" y2="408" stroke="#8250df" stroke-width="2" marker-end="url(#a)"/>
  <line x1="515" y1="436" x2="448" y2="436" stroke="#8250df" stroke-width="2" marker-end="url(#a)"/>
  <!-- 보조 도구 -->
  <rect x="225" y="474" width="160" height="44" rx="22" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="305" y="494" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2328">정찰 제안</text>
  <text x="305" y="510" text-anchor="middle" font-size="10.5" fill="#57606a">코드·파일·웹 (허락 후)</text>
  <rect x="400" y="474" width="160" height="44" rx="22" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="480" y="494" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2328">Visual Companion</text>
  <text x="480" y="510" text-anchor="middle" font-size="10.5" fill="#57606a">보는 게 나을 때 브라우저</text>
  <rect x="575" y="474" width="160" height="44" rx="22" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="655" y="494" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2328">스파이크</text>
  <text x="655" y="510" text-anchor="middle" font-size="10.5" fill="#57606a">버리는 시제품으로 확인</text>

  <line x1="480" y1="538" x2="480" y2="564" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 크기 판정 -->
  <polygon points="330,606 480,566 630,606 480,646" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="480" y="602" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">작업 크기 판정</text>
  <text x="480" y="622" text-anchor="middle" font-size="11.5" fill="#57606a">이해한 뒤 · 말로 알림 · 변경 가능</text>

  <path d="M330,606 L170,606 L170,676" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="646" x2="480" y2="676" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M630,606 L790,606 L790,676" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="678" width="220" height="62" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="170" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">빠르고 명확한 작업</text>
  <text x="170" y="725" text-anchor="middle" font-size="12" fill="#57606a">요청 그대로 → 바로 실행</text>
  <rect x="370" y="678" width="220" height="62" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="480" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">작은 변경</text>
  <text x="480" y="725" text-anchor="middle" font-size="12" fill="#57606a">전체 설명을 채팅으로</text>
  <rect x="680" y="678" width="220" height="62" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
  <text x="790" y="704" text-anchor="middle" font-size="14" font-weight="700" fill="#bc4c00">프로젝트</text>
  <text x="790" y="725" text-anchor="middle" font-size="11.5" fill="#57606a">docs/superpowers/specs/…-design.md</text>

  <!-- Builder check -->
  <line x1="790" y1="740" x2="790" y2="762" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="680" y="764" width="220" height="66" rx="10" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="790" y="788" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Builder check</text>
  <text x="790" y="806" text-anchor="middle" font-size="11.5" fill="#57606a">대화를 모르는 새 서브에이전트가</text>
  <text x="790" y="822" text-anchor="middle" font-size="11.5" fill="#57606a">계획 전에 필요한 질문만 나열</text>
  <line x1="790" y1="830" x2="790" y2="852" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="680" y="854" width="220" height="84" rx="10" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="790" y="876" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">질문 3분류 → 1회만 질문</text>
  <text x="790" y="896" text-anchor="middle" font-size="11.5" fill="#57606a">이미 답 있음 → 문서에 채움</text>
  <text x="790" y="913" text-anchor="middle" font-size="11.5" fill="#57606a">사소함 → 내 결정으로 표시</text>
  <text x="790" y="930" text-anchor="middle" font-size="11.5" fill="#57606a">사람만 답함 → 한 번에 묻기</text>

  <!-- HARD-GATE -->
  <line x1="480" y1="740" x2="480" y2="962" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="790" y1="938" x2="790" y2="962" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="330" y="964" width="590" height="50" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2.5"/>
  <text x="625" y="986" text-anchor="middle" font-size="15" font-weight="700" fill="#cf222e">HARD-GATE: 전체 설명을 승인받기 전엔 아무것도 만들지 않음</text>
  <text x="625" y="1005" text-anchor="middle" font-size="11.5" fill="#57606a">예외: 질문을 건너뛴 경우 · 허락받은 스파이크(버리는 것, 계속 쓰려면 다시 게이트)</text>

  <line x1="480" y1="1014" x2="480" y2="1036" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="790" y1="1014" x2="790" y2="1036" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="370" y="1038" width="220" height="44" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="480" y="1065" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">구현 (일반 작업 흐름)</text>
  <rect x="680" y="1038" width="220" height="44" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="790" y="1065" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">superpowers:writing-plans</text>

  <!-- 범례 -->
  <text x="60" y="800" font-size="12.5" font-weight="700" fill="#1f2328">대화 규칙</text>
  <text x="60" y="822" font-size="11.5" fill="#57606a">· 프로세스 용어 쓰지 않기</text>
  <text x="60" y="842" font-size="11.5" fill="#57606a">· 넓게 생각하되 비교는 속으로</text>
  <text x="60" y="862" font-size="11.5" fill="#57606a">· 기본값은 소리 내어 말하기</text>
  <text x="60" y="882" font-size="11.5" fill="#57606a">· "좋네요" = 보여 준 것만 승인</text>
  <text x="60" y="902" font-size="11.5" fill="#57606a">· anti-goal까지 확인</text>
</svg>
