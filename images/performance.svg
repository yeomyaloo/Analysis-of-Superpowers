<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="480" rx="16" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">쓸 때 vs 안 쓸 때 — 공식 평가 기록으로 본 차이</text>
  <text x="450" y="58" text-anchor="middle" font-size="12.5" fill="#57606a">출처: prime-radiant-inc/superpowers-evals 실험 기록 (2026-09, superpowers v6.3.0 기준)</text>

  <!-- 왼쪽 패널 -->
  <rect x="25" y="78" width="420" height="300" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="45" y="104" font-size="14.5" font-weight="700" fill="#1f2328">코드 리뷰 1건 · Claude Opus 5</text>
  <text x="45" y="123" font-size="11.5" fill="#57606a">순정(superpowers 없음) vs superpowers</text>

  <text x="45" y="152" font-size="12.5" font-weight="700" fill="#1f2328">대화 시간</text>
  <rect x="110" y="140" width="44" height="20" rx="3" fill="#8c959f"/>
  <text x="160" y="155" font-size="12" fill="#1f2328">73초</text>
  <rect x="110" y="165" width="277" height="20" rx="3" fill="#8250df"/>
  <text x="393" y="180" font-size="12" font-weight="700" fill="#8250df">461초</text>
  <text x="45" y="180" font-size="10.5" fill="#8c959f">×6.3</text>

  <text x="45" y="222" font-size="12.5" font-weight="700" fill="#1f2328">작업 비용</text>
  <rect x="110" y="210" width="20" height="20" rx="3" fill="#8c959f"/>
  <text x="136" y="225" font-size="12" fill="#1f2328">$0.33</text>
  <rect x="110" y="235" width="278" height="20" rx="3" fill="#8250df"/>
  <text x="394" y="250" font-size="12" font-weight="700" fill="#8250df">$4.63</text>
  <text x="45" y="250" font-size="10.5" fill="#8c959f">×13.9</text>

  <text x="45" y="290" font-size="12.5" font-weight="700" fill="#1f2328">결과 품질</text>
  <text x="110" y="290" font-size="12" fill="#1f2328">둘 다 pass · 근거 과장 오류 각 1건</text>
  <text x="110" y="310" font-size="12" fill="#1f2328">→ 품질 차이는 확인되지 않음</text>

  <rect x="45" y="330" width="14" height="12" fill="#8c959f"/>
  <text x="65" y="341" font-size="11.5" fill="#57606a">순정</text>
  <rect x="110" y="330" width="14" height="12" fill="#8250df"/>
  <text x="130" y="341" font-size="11.5" fill="#57606a">superpowers</text>
  <text x="45" y="364" font-size="10.5" fill="#8c959f">비용 증가는 주로 서브에이전트(하위 세션 19개, 모델 호출 232회)</text>

  <!-- 오른쪽 패널 -->
  <rect x="460" y="78" width="415" height="300" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="480" y="104" font-size="14.5" font-weight="700" fill="#1f2328">brainstorming 개선 PR #2258 전/후</text>
  <text x="480" y="123" font-size="11.5" fill="#57606a">Claude Opus 5 · 행동 시나리오 8개 · effort xhigh</text>

  <text x="480" y="160" font-size="12.5" font-weight="700" fill="#1f2328">이전</text>
  <rect x="525" y="146" width="128" height="22" fill="#1a7f37"/>
  <rect x="653" y="146" width="96" height="22" fill="#cf222e"/>
  <rect x="749" y="146" width="32" height="22" fill="#8c959f"/>
  <text x="589" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">통과 4</text>
  <text x="701" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">실패 3</text>
  <text x="765" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>

  <text x="480" y="200" font-size="12.5" font-weight="700" fill="#1f2328">개선</text>
  <rect x="525" y="186" width="192" height="22" fill="#1a7f37"/>
  <rect x="717" y="186" width="32" height="22" fill="#cf222e"/>
  <rect x="749" y="186" width="32" height="22" fill="#8c959f"/>
  <text x="621" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">통과 6</text>
  <text x="733" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="765" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>

  <rect x="525" y="220" width="12" height="12" fill="#1a7f37"/>
  <text x="542" y="231" font-size="11" fill="#57606a">통과</text>
  <rect x="580" y="220" width="12" height="12" fill="#cf222e"/>
  <text x="597" y="231" font-size="11" fill="#57606a">실패</text>
  <rect x="635" y="220" width="12" height="12" fill="#8c959f"/>
  <text x="652" y="231" font-size="11" fill="#57606a">판정 불가</text>

  <text x="480" y="266" font-size="12.5" font-weight="700" fill="#1f2328">의도 파악 시나리오</text>
  <text x="480" y="287" font-size="12" fill="#1f2328">이전: 목적을 끝까지 안 물음 → <tspan fill="#cf222e" font-weight="700">실패</tspan></text>
  <text x="480" y="307" font-size="12" fill="#1f2328">개선: 목적을 물어 반영 → <tspan fill="#1a7f37" font-weight="700">통과</tspan></text>
  <text x="480" y="340" font-size="12.5" font-weight="700" fill="#1f2328">작업 비용</text>
  <text x="560" y="340" font-size="12" fill="#1f2328">$13.46 → $17.90 (+33%)</text>
  <text x="480" y="364" font-size="10.5" fill="#8c959f">약한 모델(Luna)은 이전·개선 모두 실패 — 프롬프트로 못 메움</text>

  <!-- 주의 -->
  <rect x="25" y="392" width="850" height="70" rx="12" fill="#fff8c5" stroke="#9a6700"/>
  <text x="45" y="418" font-size="13.5" font-weight="700" fill="#9a6700">읽을 때 주의</text>
  <text x="145" y="418" font-size="12" fill="#1f2328">표본이 1~2회뿐이고 평가자(LLM)도 불안정해서 저자들도 "효과 결론 불가"로 기록했다.</text>
  <text x="145" y="442" font-size="12" fill="#1f2328">확실한 것은 비용·시간 증가, 가능성 있는 것은 의도 파악 개선. v7.0.0은 아직 측정되지 않았다.</text>
</svg>
