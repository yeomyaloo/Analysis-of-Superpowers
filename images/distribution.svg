<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="470" rx="16" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">superpowers 배포 구조 — 레포 하나, 매니페스트 여러 개</text>

  <!-- 레포 -->
  <rect x="25" y="130" width="190" height="170" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="120" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#0969da">obra/superpowers</text>
  <text x="120" y="186" text-anchor="middle" font-size="12" fill="#1f2328">하나뿐인 콘텐츠</text>
  <rect x="45" y="200" width="150" height="30" rx="6" fill="#ffffff" stroke="#0969da"/>
  <text x="120" y="220" text-anchor="middle" font-size="12.5" fill="#1f2328">skills/ (SKILL.md)</text>
  <rect x="45" y="238" width="150" height="30" rx="6" fill="#ffffff" stroke="#0969da"/>
  <text x="120" y="258" text-anchor="middle" font-size="12.5" fill="#1f2328">hooks/ (session-start)</text>
  <text x="120" y="288" text-anchor="middle" font-size="11" fill="#57606a">MIT · v7.0.0</text>

  <line x1="215" y1="215" x2="253" y2="215" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 매니페스트 -->
  <rect x="255" y="70" width="230" height="290" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="370" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">하네스별 얇은 매니페스트</text>
  <g font-size="12" fill="#1f2328">
    <text x="272" y="124">.claude-plugin/plugin.json</text>
    <text x="272" y="144">.claude-plugin/marketplace.json</text>
    <text x="272" y="170">.codex-plugin/plugin.json</text>
    <text x="272" y="194">.cursor-plugin/plugin.json</text>
    <text x="272" y="218">.antigravity-plugin/plugin.json</text>
    <text x="272" y="242">gemini-extension.json</text>
    <text x="272" y="266">.devin · .kimi · .muse</text>
    <text x="272" y="286">.hermes · .opencode · .pi</text>
  </g>
  <text x="370" y="318" text-anchor="middle" font-size="11" fill="#57606a">이름·버전·설명 + 스킬/훅 위치만</text>
  <text x="370" y="338" text-anchor="middle" font-size="11" fill="#57606a">하네스 형식에 맞춰 알려 줌</text>

  <!-- 경로 -->
  <rect x="540" y="62" width="335" height="112" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="556" y="86" font-size="14" font-weight="700" fill="#1a7f37">① 공식 마켓플레이스 (심사)</text>
  <text x="556" y="108" font-size="11.5" fill="#1f2328">Anthropic claude-plugins-official — 커밋 sha 고정</text>
  <text x="556" y="127" font-size="11.5" fill="#1f2328">OpenAI openai/plugins — 동기화 스크립트가 PR</text>
  <text x="556" y="146" font-size="11.5" fill="#1f2328">xAI Grok · Cursor 마켓플레이스</text>
  <text x="556" y="165" font-size="11" fill="#57606a">/plugin install superpowers@claude-plugins-official</text>

  <rect x="540" y="186" width="335" height="88" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="556" y="210" font-size="14" font-weight="700" fill="#8250df">② 자체 마켓플레이스 (GitHub 레포)</text>
  <text x="556" y="232" font-size="11.5" fill="#1f2328">obra/superpowers-marketplace · 심사 없음, 즉시 반영</text>
  <text x="556" y="252" font-size="11" fill="#57606a">/plugin marketplace add obra/superpowers-marketplace</text>
  <text x="556" y="267" font-size="11" fill="#57606a">/plugin install superpowers@superpowers-marketplace</text>

  <rect x="540" y="286" width="335" height="74" rx="12" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
  <text x="556" y="310" font-size="14" font-weight="700" fill="#bc4c00">③ 레포 URL 직접 설치</text>
  <text x="556" y="331" font-size="11" fill="#1f2328">gemini extensions install https://github.com/obra/superpowers</text>
  <text x="556" y="349" font-size="11" fill="#1f2328">agy plugin install … · devin plugins install obra/superpowers</text>

  <line x1="485" y1="135" x2="538" y2="118" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="485" y1="215" x2="538" y2="228" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="485" y1="290" x2="538" y2="318" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 버전 -->
  <rect x="25" y="382" width="850" height="70" rx="12" fill="#fff8c5" stroke="#9a6700"/>
  <text x="45" y="408" font-size="13.5" font-weight="700" fill="#9a6700">버전 관리</text>
  <text x="140" y="408" font-size="12" fill="#1f2328">.version-bump.json에 버전 파일 12곳 등록 → bump-version.sh 한 번으로 전부 변경, --check / --audit로 불일치 검사</text>
  <text x="140" y="432" font-size="12" fill="#1f2328">공식 스토어는 sha가 갱신돼야 새 버전 배포 · 자체 마켓플레이스와 URL 설치는 push 즉시 반영</text>
</svg>
