  <text x="38" y="292" font-size="12" fill="#57606a">③ description: "MUST use before any creative work"</text>
  <text x="450" y="336" text-anchor="middle" font-size="11" fill="#8c959f">우선순위: 사용자 지시(CLAUDE.md) &gt; 스킬 &gt; 기본 동작 · 서브에이전트는 SUBAGENT-STOP으로 제외</text>
